[package]
name = "tagshelf"
version = "3.0.0-alpha.2"
edition = "2021"
description = "TagShelf - a file browser where every file can have many tags"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tagshelf-core = { path = "../core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
